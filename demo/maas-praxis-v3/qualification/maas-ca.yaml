apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maas-root-ca
  namespace: maas-praxis-system
spec:
  isCA: true
  commonName: maas-root-ca
  secretName: maas-root-ca
  duration: 8760h
  issuerRef:
    name: maas-selfsigned-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maas-ca-issuer
  namespace: maas-praxis-system
spec:
  ca:
    secretName: maas-root-ca
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rhai-ca-issuer
spec:
  ca:
    secretName: maas-root-ca
