apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-a-fixture
  namespace: maas-praxis-system
  labels: {app: praxis-provider-fixture, provider: provider-a, run-id: poc-e2e-20260922-utc}
spec:
  replicas: 1
  selector: {matchLabels: {app: praxis-provider-fixture, provider: provider-a}}
  template:
    metadata: {labels: {app: praxis-provider-fixture, provider: provider-a, run-id: poc-e2e-20260922-utc}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: provider
          image: provider-fixture:poc-e2e-20260922
          imagePullPolicy: IfNotPresent
          env:
            - {name: PROVIDER_ID, value: provider-a}
            - {name: EXPECTED_API_KEY, value: provider-a-strict-key}
          ports: [{name: https, containerPort: 8443}]
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
          readinessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 1}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes: [{name: tls, secret: {secretName: provider-a-tls}}]
---
apiVersion: v1
kind: Service
metadata:
  name: provider-a-fixture
  namespace: maas-praxis-system
  labels: {app: praxis-provider-fixture, provider: provider-a, run-id: poc-e2e-20260922-utc}
spec:
  selector: {app: praxis-provider-fixture, provider: provider-a}
  ports: [{name: https, port: 443, targetPort: https}]
---
