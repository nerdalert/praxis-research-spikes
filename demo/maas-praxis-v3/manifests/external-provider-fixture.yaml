apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: provider-a
  namespace: models-as-a-service
  labels: {run-id: poc-e2e-20260922-utc}
spec:
  provider: openai
  endpoint: provider-a-fixture.maas-praxis-system.svc.cluster.local
  auth: {type: apikey, secretRef: {name: provider-a-credentials}}
  config: {tls.sni: provider-a.maas-praxis-system.svc.cluster.local}
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: provider-b
  namespace: models-as-a-service
  labels: {run-id: poc-e2e-20260922-utc}
spec:
  provider: openai
  endpoint: provider-b-fixture.maas-praxis-system.svc.cluster.local
  auth: {type: apikey, secretRef: {name: provider-b-credentials}}
  config: {tls.sni: provider-b.maas-praxis-system.svc.cluster.local}
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: praxis-external
  namespace: models-as-a-service
  labels: {run-id: poc-e2e-20260922-utc}
spec:
  modelName: praxis-external
  externalProviderRefs:
    - ref: {name: provider-a}
      targetModel: praxis-external
      apiFormat: openai-chat
      path: /v1/chat/completions
      config: {tls.caCertificates: /etc/praxis/provider-ca/ca.crt, tls.sni: provider-a.maas-praxis-system.svc.cluster.local}
      weight: 1
    - ref: {name: provider-b}
      targetModel: praxis-external
      apiFormat: openai-chat
      path: /v1/chat/completions
      config: {tls.caCertificates: /etc/praxis/provider-ca/ca.crt, tls.sni: provider-b.maas-praxis-system.svc.cluster.local}
      weight: 0
