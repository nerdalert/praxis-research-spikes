apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: praxis-sim
  namespace: llm-internal
spec:
  model:
    uri: hf://placeholder/no-model
    name: facebook/opt-125m
  storageInitializer:
    enabled: false
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: maas-praxis-gateway
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.7.1
        command: ["/app/llm-d-inference-sim"]
        # llmisvc_model_provider_resolver removes only the publishers/<ns>/models/
        # prefix. The served identity is therefore facebook/opt-125m.
        args: ["--port", "8000", "--model", "facebook/opt-125m", "--mode", "random"]
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        ports:
          - name: http
            containerPort: 8000
            protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: praxis-sim
  namespace: llm-internal
spec:
  modelRef:
    kind: LLMInferenceService
    name: praxis-sim
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: praxis-subscription
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: praxis-sim
      namespace: llm-internal
      tokenRateLimits:
        - limit: 100
          window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: praxis-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: praxis-sim
      namespace: llm-internal
  subjects:
    groups:
      - name: system:authenticated
    users: []
