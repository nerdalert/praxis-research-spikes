apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencemodelrewrites.llm-d.ai
spec:
  group: llm-d.ai
  names:
    kind: InferenceModelRewrite
    listKind: InferenceModelRewriteList
    plural: inferencemodelrewrites
    singular: inferencemodelrewrite
  scope: Namespaced
  versions:
  - name: v1alpha2
    schema:
      openAPIV3Schema:
        description: InferenceModelRewrite maps incoming model names to rewrite targets.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              poolRef:
                properties:
                  group:
                    default: inference.networking.k8s.io
                    type: string
                  kind:
                    default: InferencePool
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              rules:
                items:
                  properties:
                    matches:
                      items:
                        properties:
                          model:
                            properties:
                              type:
                                type: string
                              value:
                                type: string
                            required:
                            - value
                            type: object
                        type: object
                      type: array
                    targets:
                      items:
                        properties:
                          weight:
                            format: int32
                            type: integer
                          modelRewrite:
                            type: string
                        required:
                        - modelRewrite
                        type: object
                      type: array
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
