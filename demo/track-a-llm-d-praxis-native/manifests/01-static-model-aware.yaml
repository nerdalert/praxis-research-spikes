# Example 1: Static Model-Aware Baseline
#
# Two llm-d-inference-sim deployments: sim-a serves model-a,
# sim-b serves model-b. Praxis routes by model field.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-a-config
data:
  config.yaml: |
    port: 8000
    model: "model-a"
    served-model-name: ["model-a"]
    mode: "echo"
    fake-metrics:
      running-requests: 0
      waiting-requests: 0
      kv-cache-usage: 0.0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-b-config
data:
  config.yaml: |
    port: 8000
    model: "model-b"
    served-model-name: ["model-b"]
    mode: "echo"
    fake-metrics:
      running-requests: 0
      waiting-requests: 0
      kv-cache-usage: 0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-a
  template:
    metadata:
      labels:
        app: sim-a
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:dev
        imagePullPolicy: Never
        args: ["--config", "/config/config.yaml", "--v=5"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: sim-a-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-b
  template:
    metadata:
      labels:
        app: sim-b
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:dev
        imagePullPolicy: Never
        args: ["--config", "/config/config.yaml", "--v=5"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: sim-b-config
---
apiVersion: v1
kind: Service
metadata:
  name: sim-a
spec:
  selector:
    app: sim-a
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sim-b
spec:
  selector:
    app: sim-b
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
data:
  config.yaml: |
    listeners:
      - name: default
        address: "0.0.0.0:8080"
        filter_chains: [main]
    filter_chains:
      - name: main
        filters:
          - filter: llmd_endpoint_picker
            endpoints:
              - name: sim-a
                address: "sim-a:8000"
                models: ["model-a"]
                running_requests: 0
                waiting_requests: 0
                kv_cache_usage_percent: 0.0
              - name: sim-b
                address: "sim-b:8000"
                models: ["model-b"]
                running_requests: 0
                waiting_requests: 0
                kv_cache_usage_percent: 0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
    spec:
      containers:
      - name: praxis
        image: praxis-epp:dev
        imagePullPolicy: Never
        command: ["praxis"]
        args: ["-c", "/config/config.yaml"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
spec:
  type: NodePort
  selector:
    app: praxis
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
