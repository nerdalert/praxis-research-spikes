# Example 6: Saturation/Admission Gate
#
# Two llm-d-inference-sim deployments: sim-a healthy, sim-b saturated.
# Praxis configured with saturation gate thresholds.
# Requests should route to sim-a (healthy). If both were saturated,
# Praxis would return HTTP 429.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-a-config
data:
  config.yaml: |
    port: 8000
    model: "fake-model"
    served-model-name: ["fake-model"]
    mode: "echo"
    fake-metrics:
      running-requests: 1
      waiting-requests: 0
      kv-cache-usage: 0.1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-b-config
data:
  config.yaml: |
    port: 8000
    model: "fake-model"
    served-model-name: ["fake-model"]
    mode: "echo"
    fake-metrics:
      running-requests: 20
      waiting-requests: 15
      kv-cache-usage: 0.95
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-a
  template:
    metadata:
      labels:
        app: sim-a
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:dev
        imagePullPolicy: Never
        args: ["--config", "/config/config.yaml", "--v=5"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: sim-a-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-b
  template:
    metadata:
      labels:
        app: sim-b
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:dev
        imagePullPolicy: Never
        args: ["--config", "/config/config.yaml", "--v=5"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: sim-b-config
---
apiVersion: v1
kind: Service
metadata:
  name: sim-a
spec:
  selector:
    app: sim-a
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sim-b
spec:
  selector:
    app: sim-b
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
data:
  config.yaml: |
    listeners:
      - name: default
        address: "0.0.0.0:8080"
        filter_chains: [main]
    filter_chains:
      - name: main
        filters:
          - filter: llmd_endpoint_picker
            metrics_refresh_ms: 1000
            metrics_timeout_ms: 500
            endpoints:
              - name: sim-a
                address: "sim-a:8000"
                models: ["fake-model"]
                metrics_url: "http://sim-a:8000/metrics"
                running_requests: 1
                waiting_requests: 0
                kv_cache_usage_percent: 10.0
              - name: sim-b
                address: "sim-b:8000"
                models: ["fake-model"]
                metrics_url: "http://sim-b:8000/metrics"
                running_requests: 20
                waiting_requests: 15
                kv_cache_usage_percent: 95.0
            saturation_gate:
              enabled: true
              queue_depth_threshold: 10
              kv_cache_util_threshold: 0.9
              pool_saturation_threshold: 1.0
              headroom: 0.2
              reject_status: 429
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
    spec:
      containers:
      - name: praxis
        image: praxis-epp:dev
        imagePullPolicy: Never
        command: ["praxis"]
        args: ["-c", "/config/config.yaml"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
spec:
  type: NodePort
  selector:
    app: praxis
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
