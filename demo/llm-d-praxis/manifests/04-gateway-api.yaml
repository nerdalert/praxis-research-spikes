# Example 4: Gateway API HTTPRoute
#
# HTTPRoute -> InferencePool -> PodList discovery chain.
# Praxis reads the HTTPRoute, extracts the InferencePool backendRef,
# and discovers pod endpoints through the full chain.
#
# Prerequisites: install crds/inferencepool-crd.yaml and
# crds/httproute-crd.yaml first.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-a-config
data:
  config.yaml: |
    port: 8000
    model: "fake-model"
    served-model-name: ["fake-model"]
    mode: "echo"
    fake-metrics:
      running-requests: 0
      waiting-requests: 0
      kv-cache-usage: 0.0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-b-config
data:
  config.yaml: |
    port: 8000
    model: "fake-model"
    served-model-name: ["fake-model"]
    mode: "echo"
    fake-metrics:
      running-requests: 5
      waiting-requests: 2
      kv-cache-usage: 0.5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-sim
      pool: sim-pool
      instance: sim-a
  template:
    metadata:
      labels:
        app: llm-d-sim
        pool: sim-pool
        instance: sim-a
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:dev
        imagePullPolicy: Never
        args: ["--config", "/config/config.yaml", "--v=5"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: sim-a-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-sim
      pool: sim-pool
      instance: sim-b
  template:
    metadata:
      labels:
        app: llm-d-sim
        pool: sim-pool
        instance: sim-b
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:dev
        imagePullPolicy: Never
        args: ["--config", "/config/config.yaml", "--v=5"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: sim-b-config
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferencePool
metadata:
  name: sim-pool
spec:
  targetPortNumber: 8000
  selector:
    app: llm-d-sim
    pool: sim-pool
  extensionRef:
    name: praxis
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-route
spec:
  rules:
  - backendRefs:
    - group: inference.networking.x-k8s.io
      kind: InferencePool
      name: sim-pool
      port: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: praxis-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: praxis-discovery
rules:
- apiGroups: ["inference.networking.x-k8s.io"]
  resources: ["inferencepools"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: praxis-discovery
subjects:
- kind: ServiceAccount
  name: praxis-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: praxis-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
data:
  config.yaml: |
    listeners:
      - name: default
        address: "0.0.0.0:8080"
        filter_chains: [main]
    filter_chains:
      - name: main
        filters:
          - filter: llmd_endpoint_picker
            metrics_refresh_ms: 1000
            metrics_timeout_ms: 500
            gateway_api:
              http_route:
                name: llm-route
                namespace: default
              models: ["fake-model"]
              metrics_path: "/metrics"
              inference_pool_api_version: "inference.networking.x-k8s.io/v1alpha2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
    spec:
      serviceAccountName: praxis-sa
      containers:
      - name: praxis
        image: praxis-epp:dev
        imagePullPolicy: Never
        command: ["praxis"]
        args: ["-c", "/config/config.yaml"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
spec:
  type: NodePort
  selector:
    app: praxis
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
