# Track B demo: Praxis with llmd_external_epp filter.
#
# The Go EPP selects the upstream endpoint dynamically via
# x-gateway-destination-endpoint, and the filter sets ctx.upstream.

listeners:
  - name: llmd
    address: "127.0.0.1:18091"
    filter_chains: [epp]

filter_chains:
  - name: epp
    filters:
      - filter: llmd_external_epp
        target: "http://127.0.0.1:9002"
        request_timeout_ms: 10000
        max_request_body_bytes: 4194304
        status_on_error: 503
