apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: llmd-track-b-v2
data:
  praxis.yaml: |
    listeners:
      - name: llmd-fd
        address: "0.0.0.0:8080"
        filter_chains: [full-duplex-epp]

    filter_chains:
      - name: full-duplex-epp
        filters:
          - filter: ext_proc
            target: "http://go-epp.llmd-track-b-v2.svc.cluster.local:9002"
            message_timeout_ms: 5000
            lifecycle_timeout_ms: 10000
            status_on_error: 503
            processing_mode:
              request_header_mode: send
              response_header_mode: skip
              request_body_mode: full_duplex_streamed
              response_body_mode: none
              request_trailer_mode: skip
              response_trailer_mode: skip
          - filter: endpoint_selector
            source_header: x-gateway-destination-endpoint
            required: true
            status_on_required_failure: 503
            strip_header: true

    admin:
      address: "0.0.0.0:9901"

    insecure_options:
      allow_public_admin: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: llmd-track-b-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
    spec:
      containers:
        - name: praxis
          image: praxis-track-b-v2:local
          imagePullPolicy: Never
          args:
            - -c
            - /etc/praxis/praxis.yaml
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9901
              name: admin
          readinessProbe:
            httpGet:
              path: /healthy
              port: 9901
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/praxis/praxis.yaml
              subPath: praxis.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
  namespace: llmd-track-b-v2
spec:
  type: NodePort
  selector:
    app: praxis
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30093
      name: http
