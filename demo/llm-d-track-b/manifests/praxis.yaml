apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: llmd-track-b
data:
  praxis.yaml: |
    listeners:
      - name: llmd
        address: "0.0.0.0:8080"
        filter_chains: [epp]

    filter_chains:
      - name: epp
        filters:
          - filter: llmd_external_epp
            target: "http://go-epp.llmd-track-b.svc.cluster.local:9002"
            request_timeout_ms: 10000
            max_request_body_bytes: 4194304
            status_on_error: 503

    admin:
      address: "0.0.0.0:9901"

    insecure_options:
      allow_public_admin: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: llmd-track-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
    spec:
      containers:
        - name: praxis
          image: praxis-track-b:local
          imagePullPolicy: Never
          args:
            - -c
            - /etc/praxis/praxis.yaml
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9901
              name: admin
          readinessProbe:
            httpGet:
              path: /healthy
              port: 9901
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/praxis/praxis.yaml
              subPath: praxis.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
  namespace: llmd-track-b
spec:
  type: NodePort
  selector:
    app: praxis
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30092
      name: http
