# Environment config for provider gateway /v1/responses validation.
#
# Uses the mock-openai provider backend to serve both Chat Completions
# and the OpenAI Responses API (/v1/responses) through the provider
# gateway's ext_proc path.
#
# Requires: grid-mock-providers:latest image (built from mock-providers/Containerfile)

[clusters]
names = ["provider", "consumer"]

[clusters.provider]
models = ["model-a"]
role = "provider"
backend = "mock-openai"

[clusters.consumer]
models = []
role = "consumer"

[providers]
openai = { port = 10001 }
anthropic = { port = 10002 }
bedrock = { port = 10003, region = "us-east-1" }
vertex = { port = 10004, project = "test-project" }
